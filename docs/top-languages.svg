<svg width="470" height="195" viewBox="0 0 470 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Top Languages</title>
  <desc id="desc">Top programming languages with C# in green, CSS in purple, and Python in orange.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .title { fill: #58a6ff; font: 600 28px Segoe UI, Arial, sans-serif; }
    .label { fill: #c9d1d9; font: 16px Segoe UI, Arial, sans-serif; }
    .muted { fill: #8b949e; font: 12px Segoe UI, Arial, sans-serif; }
  </style>

  <rect class="card" x="0.5" y="0.5" width="469" height="194" rx="8"/>

  <text class="title" x="38" y="45">Top Languages</text>
  <text class="muted" x="38" y="68">Most common languages across my public repos</text>

  <rect x="42" y="96" width="14" height="14" rx="2" fill="#2ea043"/>
  <text class="label" x="68" y="109">C#</text>

  <rect x="42" y="125" width="14" height="14" rx="2" fill="#8957e5"/>
  <text class="label" x="68" y="138">CSS</text>

  <rect x="42" y="154" width="14" height="14" rx="2" fill="#f97316"/>
  <text class="label" x="68" y="167">Python</text>

  <g transform="translate(345 112)">
    <circle r="48" fill="none" stroke="#2ea043" stroke-width="22"/>
    <circle r="48" fill="none" stroke="#8957e5" stroke-width="22" stroke-dasharray="75 227" stroke-dashoffset="-227" transform="rotate(-90)"/>
    <circle r="48" fill="none" stroke="#f97316" stroke-width="22" stroke-dasharray="45 257" stroke-dashoffset="-151" transform="rotate(-90)"/>
    <circle r="29" fill="#0d1117"/>
  </g>
</svg>
